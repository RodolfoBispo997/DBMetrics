services:
  postgres:
    image: postgres:16-alpine

    container_name: evolution-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution123
      POSTGRES_DB: evolution

    ports:
      - "5433:5432"

    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data

    networks:
      - evolution-network

  redis:
    image: redis:7-alpine

    container_name: evolution-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - ./volumes/redis:/data

    networks:
      - evolution-network

  evolution-api:
    image: evoapicloud/evolution-api:latest

    container_name: evolution-api

    restart: unless-stopped

    depends_on:
      - postgres
      - redis

    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - ./volumes/evolution:/evolution/instances

    networks:
      - evolution-network

networks:
  evolution-network:
    driver: bridge
